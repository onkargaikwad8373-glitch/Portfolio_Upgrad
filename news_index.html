<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Channel Practice</title>
    <style>
        header{
            height: auto;
            width: 100%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 3px 10px black;
        }

        nav{
            text-decoration: none;
        }

        nav a{
            margin-left: 10px;
            margin-bottom: 10px;
            font-size: 20px;
            color: black;
            text-decoration: none;
        }

        .logo{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main{
            display: flex;
            justify-content: center;
        }

        .container{
            height: auto;
            width: 50%;
            border: 1px solid black;
            /* display: flex;
            justify-content: center;
            align-items: center; */
            margin-top: 20px;
        }

        .container p{
            margin: 20px;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>THE HINDU</h1>
            </div>
            <div class="info">
                <a href="">World</a>
                <a href="">Sport</a>
                <a href="">Entertainment</a>
                <a href="">Data</a>
                <a href="">Health</a>
                <a href="">Opinion</a>
                <a href="">Science</a>
                <a href="">Premium</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <p>The Rohingya question: International solidarity, accountability and the missing road home </p>
        </div>
    </main>

    <footer>

    </footer>

</body>
</html>
